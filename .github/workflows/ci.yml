name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify generated Cloudflare bindings
        run: npm run cf:types:check

      - name: Typecheck frontend and Worker
        run: npm run typecheck

      - name: Lint the new Worker boundary
        run: npm run lint:worker

      - name: Run frontend unit tests
        run: npm test

      - name: Run Worker runtime tests
        run: npm run test:worker

      - name: Apply D1 migrations locally
        run: npm run db:migrate:local

      - name: Build frontend
        run: npm run build

      - name: Validate Worker bundle
        run: npm run build:worker
